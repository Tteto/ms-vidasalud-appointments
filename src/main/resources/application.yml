server:
  port: 8081

spring:
  application:
    name: ms-vidasalud-appointments

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0

  rabbitmq:
    # Los dos nodos del cluster: si uno cae, el cliente se conecta al otro
    addresses: ${RABBIT_ADDRESSES:localhost:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    # Si RabbitMQ no responde, no dejar esperando la petición del usuario
    connection-timeout: 3s

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Nombres centralizados de RabbitMQ (productor)
app:
  rabbit:
    exchange-atenciones: vidasalud.atenciones
    # routing key = prefijo + estado en minúsculas (ej: atencion.confirmada)
    prefijo-routing-key: atencion.

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:appointments;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST}:${ORACLE_PORT:1521}/${ORACLE_SERVICE}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.OracleDialect

management:
  endpoints:
    web:
      exposure:
        include: health
